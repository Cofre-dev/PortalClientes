<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="login-form">
                    <div class="logo">
                        <i class="fas fa-building"></i>
                        <h1>Portal de Clientes</h1>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Usuario</label>
                            <input type="text" id="username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i>
                            Iniciar Sesión
                        </button>
                    </form>

                    <div class="register-link">
                        <p>¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Register Screen -->
        <div id="registerScreen" class="screen">
            <div class="login-container">
                <div class="login-form">
                    <div class="logo">
                        <i class="fas fa-user-plus"></i>
                        <h1>Registro de Cliente</h1>
                    </div>

                    <form id="registerForm">
                        <div class="form-group">
                            <label for="regUsername">Usuario</label>
                            <input type="text" id="regUsername" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="regPassword">Contraseña</label>
                            <input type="password" id="regPassword" name="password" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="razonSocial">Razón Social</label>
                            <input type="text" id="razonSocial" name="razon_social" required>
                        </div>

                        <div class="form-group">
                            <label for="rutEmpresa">RUT Empresa (sin puntos ni guión)</label>
                            <input type="text" id="rutEmpresa" name="rut_empresa" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-plus"></i>
                            Registrarse
                        </button>
                    </form>

                    <div class="register-link">
                        <p>¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión aquí</a></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="screen">
            <nav class="navbar">
                <div class="nav-brand">
                    <i class="fas fa-building"></i>
                    Portal de Clientes
                </div>
                <div class="nav-user">
                    <span id="userInfo"></span>
                    <button id="logoutBtn" class="btn btn-outline">
                        <i class="fas fa-sign-out-alt"></i>
                        Cerrar Sesión
                    </button>
                </div>
            </nav>

            <div class="dashboard-container">
                <div class="dashboard-header">
                    <h2><i class="fas fa-file-alt"></i> Mis Documentos</h2>
                    <button id="refreshBtn" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i>
                        Actualizar
                    </button>
                </div>

                <div id="documentsContainer" class="documents-grid">
                    <!-- Los documentos se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando...</p>
            </div>
        </div>

        <!-- Notification -->
        <div id="notification" class="notification">
            <span id="notificationText"></span>
            <button id="closeNotification" class="close-btn">×</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
